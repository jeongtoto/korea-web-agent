name: Align v0.7.0 release metadata

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.ref == 'feature/v0.7-shopping-intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align release metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.7.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '0.7.0';
          if (lock.packages && lock.packages['']) lock.packages[''].version = '0.7.0';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          const replace = (path, from, to) => {
            const before = fs.readFileSync(path, 'utf8');
            const after = before.replace(from, to);
            if (after === before) throw new Error(`Expected release token not found in ${path}`);
            fs.writeFileSync(path, after);
          };

          replace('netlify/functions/health.mjs', /version: ['"]0\.6\.2['"]/, "version: '0.7.0'");
          replace('openapi/korea-web-agent-action.yaml', /^\s*version:\s*0\.6\.2\s*$/m, '  version: 0.7.0');

          for (const path of ['.github/workflows/production-smoke.yml', 'tests/version-metadata.test.ts', 'tests/openapi-v062.test.ts']) {
            const before = fs.readFileSync(path, 'utf8');
            const after = before.replaceAll('v0.6.2', 'v0.7.0').replaceAll('0.6.2', '0.7.0').replaceAll('0\\.6\\.2', '0\\.7\\.0');
            if (after === before) throw new Error(`Expected version references not found in ${path}`);
            fs.writeFileSync(path, after);
          }

          const readme = fs.readFileSync('README.md', 'utf8');
          if (!readme.includes('## v0.7.0 Shopping Intelligence')) {
            const section = `\n## v0.7.0 Shopping Intelligence\n\n- Broad multi-query discovery with bounded 20–50 candidate normalization\n- Verified hard-constraint gating for portable displays and bedding\n- Top 5 deep review research with duplicate, sponsored, and repeated-negative controls\n- Top 5 targeted price checks and Top 3 full Provider v2 verification\n- Public recommendation ranking isolated from authenticated Relay personalization\n- Exact model and URL research remain on the authoritative v0.6.2 Provider v2 path\n\n`;
            const firstHeadingEnd = readme.indexOf('\n', readme.indexOf('# '));
            fs.writeFileSync('README.md', readme.slice(0, firstHeadingEnd + 1) + section + readme.slice(firstHeadingEnd + 1));
          }
          NODE
          rm .github/workflows/release-v070.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json netlify/functions/health.mjs openapi/korea-web-agent-action.yaml .github/workflows/production-smoke.yml tests/version-metadata.test.ts tests/openapi-v062.test.ts README.md .github/workflows/release-v070.yml
          git commit -m 'chore: release Shopping Intelligence v0.7.0'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
