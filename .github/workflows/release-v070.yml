name: Align v0.7.0 release metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release-v070.mjs
      - run: |
          rm scripts/release-v070.mjs .github/workflows/release-v070.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: release Shopping Intelligence v0.7.0'
          git push origin main
