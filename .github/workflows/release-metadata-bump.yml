name: Release metadata bump

on:
  push:
    branches: [feature/v0.7.2-evidence-aware-recommendation]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.2-evidence-aware-recommendation
          fetch-depth: 0
      - name: Align v0.7.2 metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['version'] = '0.7.2'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lock = Path('package-lock.json')
          data = json.loads(lock.read_text(encoding='utf-8'))
          data['version'] = '0.7.2'
          data['packages']['']['version'] = '0.7.2'
          lock.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          openapi = Path('openapi/korea-web-agent-action.yaml')
          text = openapi.read_text(encoding='utf-8')
          text, count = re.subn(r'(?m)^  version: 0\.7\.1$', '  version: 0.7.2', text, count=1)
          assert count == 1
          openapi.write_text(text, encoding='utf-8')

          health = Path('netlify/functions/health.mjs')
          text = health.read_text(encoding='utf-8')
          assert "version: '0.7.1'" in text
          health.write_text(text.replace("version: '0.7.1'", "version: '0.7.2'", 1), encoding='utf-8')

          version_test = Path('tests/version-metadata.test.ts')
          text = version_test.read_text(encoding='utf-8')
          text = text.replace("const VERSION = '0.7.1';", "const VERSION = '0.7.2';", 1)
          text = text.replace("all v0.7.1 release metadata agrees exactly", "all v0.7.2 release metadata agrees exactly", 1)
          text = text.replace(r'0\.7\.1', r'0\.7\.2')
          version_test.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8').replace('v0.7.1', 'v0.7.2')
          marker = '## v0.7.2 Evidence-Aware Recommendation\n'
          if marker not in text:
              insert = '''## v0.7.2 Evidence-Aware Recommendation\n\n- Preliminary finalist selection prioritizes verified facts and evidence coverage over search prominence.\n- Review trust discounts sponsored material, stale reports, duplicated/reposted claims, and identity-mismatched evidence; search snippets never become verified-purchase evidence.\n- Value ranking separates product merit from price verification so a modestly more expensive but materially better product can outrank a weak cheapest option.\n- Unknown or indicative prices may inform research but cannot claim best-value eligibility; unresolved shipping lowers price confidence without lowering product-quality merit.\n- Recommendations expose deterministic tiers (`STRONG_RECOMMENDATION`, `RECOMMENDED`, `PROMISING_NEEDS_VERIFICATION`, `CAUTION`) and structured rationale.\n- Relay availability remains diagnostic/personalization-only and cannot change the public recommendation score, tier, order, or value eligibility.\n- Golden quality cases cover sponsored-volume bias, recent repeated defects, bedding quality trade-offs, unknown-price handling, and commerce-snippet misclassification.\n\n'''
              text = text.replace('## v0.7.2 Live Verification Hardening\n', insert + '## v0.7.2 Live Verification Hardening\n', 1)
          readme.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- package.json package-lock.json openapi/korea-web-agent-action.yaml netlify/functions/health.mjs tests/version-metadata.test.ts README.md
      - name: Commit aligned metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json openapi/korea-web-agent-action.yaml netlify/functions/health.mjs tests/version-metadata.test.ts README.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore: align v0.7.2 release metadata'
          git push origin HEAD:feature/v0.7.2-evidence-aware-recommendation
