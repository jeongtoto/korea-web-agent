name: temporary v0.7.4 release metadata

on:
  push:
    branches:
      - feature/v0.7.4-seller-verification-graduation
    paths:
      - .github/workflows/tmp-v074-release-metadata.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.4-seller-verification-graduation
      - name: Apply structural release metadata patch
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          VERSION = '0.7.4'

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          assert package['dependencies']['@netlify/blobs'] == '10.7.13'
          package['version'] = VERSION
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          assert lock['packages']['']['dependencies']['@netlify/blobs'] == '10.7.13'
          assert lock['packages']['node_modules/@netlify/blobs']['version'] == '10.7.13'
          lock['version'] = VERSION
          lock['packages']['']['version'] = VERSION
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n')

          health_path = Path('netlify/functions/health.mjs')
          health = health_path.read_text()
          assert "version: '0.7.3'" in health
          health_path.write_text(health.replace("version: '0.7.3'", "version: '0.7.4'", 1))

          test_path = Path('tests/version-metadata.test.ts')
          version_test = test_path.read_text()
          version_test = version_test.replace("const VERSION = '0.7.3';", "const VERSION = '0.7.4';", 1)
          version_test = version_test.replace("all v0.7.3 release metadata agrees exactly", "all v0.7.4 release metadata agrees exactly", 1)
          version_test = version_test.replace(r"0\.7\.3", r"0\.7\.4")
          version_test = version_test.replace(r"v0\.7\.3 production deploy", r"v0\.7\.4 production deploy")
          test_path.write_text(version_test)

          openapi_path = Path('openapi/korea-web-agent-action.yaml')
          openapi = openapi_path.read_text()
          assert '  version: 0.7.3\n' in openapi
          openapi = openapi.replace('  version: 0.7.3\n', '  version: 0.7.4\n', 1)
          marker = """        validationWarnings:\n          type: array\n          items: { $ref: '#/components/schemas/ReliabilityIssue' }\n        presentation:\n"""
          replacement = """        validationWarnings:\n          type: array\n          items: { $ref: '#/components/schemas/ReliabilityIssue' }\n        verificationGap:\n          type: string\n          enum: [seller_resolution_failed, seller_identity_mismatch, shipping_unknown, availability_unresolved, mandatory_fee_unknown]\n        presentation:\n"""
          assert marker in openapi
          openapi = openapi.replace(marker, replacement, 1)
          openapi_path.write_text(openapi)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          assert readme.startswith('# Korea Web Agent v0.7.3\n')
          readme = readme.replace('# Korea Web Agent v0.7.3\n', '# Korea Web Agent v0.7.4\n', 1)
          marker = '## v0.7.3 Recommendation Output Contract\n'
          assert marker in readme
          section = """## v0.7.4 Seller Verification Graduation\n\n- Comparison providers resolve downstream sellers through deterministic static links, embedded seller metadata, bounded public redirects, then exact-model fallback discovery only when seller resolution still yields no target.\n- Comparison/search prices remain indicative discovery data. Decisive public economics come only from an exact downstream seller page that verifies product identity, current seller price, shipping, availability, and required bundle state.\n- Seller-page price overrides a cheaper comparison-advertised value. Known mandatory purchase fees are included in `totalCashPrice`; an unknown mandatory fee blocks decisive eligibility.\n- `verificationGap` exposes one dominant terminal reason for `INSUFFICIENT`: `seller_identity_mismatch`, `mandatory_fee_unknown`, `shipping_unknown`, `availability_unresolved`, or `seller_resolution_failed`. Raw provider fetch messages are not surfaced through public market coverage.\n- Unknown shipping still never defaults to zero, search metadata still cannot win public cash ranking, and Relay remains personalization-only without mutating public result order, score, or price history.\n- Golden G1-G13 seller-graduation cases and the exact WideView `QWGE43UT1 + EKWBYME78W(V3)` regression benchmark protect the release contract.\n\n"""
          readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)

          # Guard the known dependency-drift failure mode explicitly.
          package_after = json.loads(package_path.read_text())
          lock_after = json.loads(lock_path.read_text())
          assert package_after['dependencies']['@netlify/blobs'] == '10.7.13'
          assert lock_after['packages']['']['dependencies']['@netlify/blobs'] == '10.7.13'
          assert lock_after['packages']['node_modules/@netlify/blobs']['version'] == '10.7.13'
          PY
      - name: Commit metadata only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json netlify/functions/health.mjs tests/version-metadata.test.ts openapi/korea-web-agent-action.yaml README.md
          git commit -m "chore: align v0.7.4 release metadata"
          git push origin HEAD:feature/v0.7.4-seller-verification-graduation
