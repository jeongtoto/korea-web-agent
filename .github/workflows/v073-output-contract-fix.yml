name: v0.7.3 output contract fix

on:
  push:
    branches: ['feature/v0.7.3-recommendation-output-contract']
    paths: ['.github/workflows/v073-output-contract-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.3-recommendation-output-contract
      - name: Apply minimal tier-gated BUY fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/agent/research.ts')
          s = p.read_text()
          old = "  const hasRecommendations = shopping.assessments.length > 0;\n"
          new = old + "  const hasConfirmedRecommendation = shopping.assessments.some((item) =>\n    item.recommendationTier === 'STRONG_RECOMMENDATION' || item.recommendationTier === 'RECOMMENDED');\n"
          if old not in s:
              raise SystemExit('target declaration not found')
          s = s.replace(old, new, 1)
          old_decision = "    decision: hasRecommendations ? 'BUY' : 'INSUFFICIENT',"
          new_decision = "    decision: hasConfirmedRecommendation ? 'BUY' : 'INSUFFICIENT',"
          if old_decision not in s:
              raise SystemExit('target decision not found')
          s = s.replace(old_decision, new_decision, 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/research.ts
          git commit -m "fix: gate shopping BUY on verified recommendation tier"
          git push origin HEAD:feature/v0.7.3-recommendation-output-contract
