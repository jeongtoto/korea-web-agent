name: v074-direct-page-green

on:
  push:
    branches:
      - feature/v0.7.4-seller-verification-graduation
    paths:
      - .github/workflows/v074-direct-page-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.4-seller-verification-graduation
          fetch-depth: 0
      - name: Apply exact patch
        run: node .github/v074-patch-direct-page.mjs
      - name: Verify scope and commit
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "src/providers/direct-page.ts "
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/providers/direct-page.ts
          git commit -m "feat: expose embedded comparison seller records"
          git push origin HEAD:feature/v0.7.4-seller-verification-graduation
