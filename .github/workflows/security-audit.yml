name: Production dependency audit

# audit-attempt: 2
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/security-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only
      - name: Install production dependency graph from lock
        run: npm ci --omit=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency lock after successful audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git commit -m 'chore: lock verified dependency graph'
          git push origin HEAD:main
