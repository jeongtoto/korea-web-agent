name: Live research check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-research-check.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run live public research
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/research.json --write-out '%{http_code}' --max-time 180 \
            -H 'content-type: application/json' \
            -d '{"url":"https://brand.naver.com/mildo/products/7322162980","question":"이 침대 어때? 지금 가격이면 살만한지까지 봐줘.","includeLocalRelay":false,"category":"auto"}' \
            https://korea-web-agent.netlify.app/api/research)"
          echo "HTTP $status"
          jq '{id,status,createdAt,updatedAt,decision:(.report.decision // null),evidence_count:(.evidence | length),source_count:(.sourceResults | length),errors}' /tmp/research.json
          test "$status" = '201'
          jq -e '.status == "completed" or .status == "partial"' /tmp/research.json >/dev/null
          jq -e '.report.decision == "BUY" or .report.decision == "WAIT" or .report.decision == "SKIP" or .report.decision == "INSUFFICIENT"' /tmp/research.json >/dev/null
          jq -e '(.sourceResults | length) > 0' /tmp/research.json >/dev/null
