name: v074-task5-source-patch
on:
  workflow_dispatch:
  push:
    branches:
      - feature/v0.7.4-seller-verification-graduation
    paths:
      - .github/workflows/v074-task5-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.4-seller-verification-graduation
      - name: Fix mandatory fee type narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/providers/direct-page.ts')
          text = path.read_text()
          old = "    if (localAmounts.length === 1) amounts.add(localAmounts[0]);\n  }\n  if (!signaled) return { mandatoryFeeSignal: false };\n  return amounts.size === 1\n    ? { mandatoryFeeSignal: true, mandatoryPurchaseFee: [...amounts][0] }\n    : { mandatoryFeeSignal: true };\n"
          new = "    const onlyAmount = localAmounts[0];\n    if (localAmounts.length === 1 && onlyAmount !== undefined) amounts.add(onlyAmount);\n  }\n  if (!signaled) return { mandatoryFeeSignal: false };\n  const onlyAmount = amounts.size === 1 ? [...amounts][0] : undefined;\n  return onlyAmount !== undefined\n    ? { mandatoryFeeSignal: true, mandatoryPurchaseFee: onlyAmount }\n    : { mandatoryFeeSignal: true };\n"
          if old not in text:
              raise SystemExit('mandatory fee narrowing marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/direct-page.ts
          git diff --cached --check
          git commit -m "fix: narrow mandatory fee amounts safely"
          git push origin HEAD:feature/v0.7.4-seller-verification-graduation
