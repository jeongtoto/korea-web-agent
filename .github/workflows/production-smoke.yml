name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Netlify production health
        shell: bash
        run: |
          set -euo pipefail
          url='https://korea-web-agent.netlify.app/api/health'
          for attempt in $(seq 1 35); do
            body="$(curl --fail --silent --show-error --max-time 15 "$url" || true)"
            if echo "$body" | jq -e '.ok == true and .service == "korea-web-agent" and .version == "0.7.2" and .runtime == "netlify"' >/dev/null 2>&1; then
              echo "$body"
              exit 0
            fi
            echo "Waiting for v0.7.2 production deploy ($attempt/35)..."
            sleep 4
          done
          echo 'Netlify v0.7.2 health endpoint did not become ready in time.' >&2
          exit 1

      - name: Verify PWA diagnostic shell
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --max-time 15 https://korea-web-agent.netlify.app/)"
          grep -F '<title>Korea Web Agent</title>' <<<"$html"
          grep -F '내 PC 로그인 세션의 개인화 가격/배송도 확인' <<<"$html"

      - name: Verify relay status endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 15 https://korea-web-agent.netlify.app/api/relay/status)"
          echo "$body"
          echo "$body" | jq -e 'has("enabled") and has("online") and has("state") and has("lastSeenAt") and has("heartbeatAgeMs") and has("onlineTtlMs")' >/dev/null
          echo "$body" | jq -e '.state == "not_configured" or .state == "never_seen" or .state == "online" or .state == "stale"' >/dev/null

      - name: Verify legacy research route validation
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/research.json --write-out '%{http_code}' --max-time 15 \
            -H 'content-type: application/json' \
            -d '{}' \
            https://korea-web-agent.netlify.app/api/research)"
          cat /tmp/research.json
          test "$status" = '400'
          jq -e 'has("error")' /tmp/research.json >/dev/null

      - name: Verify ChatGPT Action start route is protected
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/agent-start.json --write-out '%{http_code}' --max-time 15 \
            -H 'content-type: application/json' \
            -d '{"query":"와이드뷰 43인치 4K V3 스탠드 어때?"}' \
            https://korea-web-agent.netlify.app/api/agent/research)"
          cat /tmp/agent-start.json
          case "$status" in 401|503) ;; *) echo "unexpected Action status: $status" >&2; exit 1;; esac
          jq -e 'has("error")' /tmp/agent-start.json >/dev/null

      - name: Verify ChatGPT Action status route is protected
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/agent-job.json --write-out '%{http_code}' --max-time 15 \
            'https://korea-web-agent.netlify.app/api/agent/job?jobId=nonexistent')"
          cat /tmp/agent-job.json
          case "$status" in 401|503) ;; *) echo "unexpected Action status: $status" >&2; exit 1;; esac
          jq -e 'has("error")' /tmp/agent-job.json >/dev/null
