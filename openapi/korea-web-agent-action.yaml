openapi: 3.1.0
info:
  title: Korea Web Agent
  version: 0.5.1
  description: Read-only multi-market Korean buying research with authenticated local-browser offer verification and category-aware Best 3 recommendations.
servers:
  - url: https://korea-web-agent.netlify.app
security:
  - bearerAuth: []
paths:
  /api/agent/research:
    post:
      operationId: startProductResearch
      summary: Research a concrete product and decide whether current evidence supports buying, waiting, skipping, or more research.
      description: Research exactly one product or recommendation category per call. Split compound requests. Pass stated cards/memberships. Preserve resolved SKU details from conversation context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: One product or recommendation category only. Include full brand/model/variant/bundle identity. Split multi-product requests into separate Action calls.
                url:
                  type: string
                  format: uri
                  maxLength: 4000
                  description: Optional public product or Naver Shopping Live URL when the user supplied one.
                purchaseContext:
                  $ref: '#/components/schemas/PurchaseContext'
      responses:
        '200':
          description: Research completed without a pending authenticated-browser job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResearchResult'
        '202':
          description: Public research completed and an authenticated PC browser result is pending. Poll pollUrl or getProductResearchResult using jobId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResearchResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/agent/job:
    get:
      operationId: getProductResearchResult
      summary: Get the latest result for a product research job.
      description: Call after startProductResearch returns status=running. Pass the returned jobId unchanged and continue only while status is running.
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Current or final structured research result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResearchResult'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key
  responses:
    Error:
      description: Request error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
  schemas:
    ResearchIntent:
      type: object
      required: [productResearch, purchaseDecision, priceSensitive, personalizedPriceUseful, specOnly]
      properties:
        productResearch: { type: boolean }
        purchaseDecision: { type: boolean }
        priceSensitive: { type: boolean }
        personalizedPriceUseful: { type: boolean }
        specOnly: { type: boolean }
    PriceSnapshot:
      type: object
      required: [currency]
      properties:
        currency: { type: string }
        listPrice: { type: number }
        salePrice: { type: number }
        couponPrice: { type: number }
        membershipPrice: { type: number }
        sellerInstantDiscount: { type: number }
        couponDiscount: { type: number }
        cardInstantDiscount: { type: number }
        cardStatementDiscount: { type: number }
        membershipDiscount: { type: number }
        cashPaymentPrice: { type: number }
        estimatedPoints: { type: number }
        basePoints: { type: number }
        membershipPoints: { type: number }
        liveSpecialPoints: { type: number }
        totalExpectedPoints: { type: number }
        effectivePrice: { type: number }
        shippingFee: { type: number }
        shippingEta: { type: string }
        selectedOption: { type: string }
        availability: { type: string }
        dealType: { type: string }
        liveId: { type: string }
        liveStatus: { type: string }
        liveEndAt: { type: string }
        sourceUrl: { type: string, format: uri }
    PurchaseContext:
      type: object
      additionalProperties: false
      properties:
        ownedCards:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
          description: Cards the user actually owns. Never infer ownership from a displayed promotion.
        memberships:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        budget: { type: number, exclusiveMinimum: 0 }
        region: { type: string, maxLength: 200 }
        preferences:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
    MarketOffer:
      type: object
      required: [id, market, title, url, currency, retrievedAt, verification, condition, identityScore, bundleComplete, eligible, conditions, riskFlags, exclusionReasons]
      properties:
        id: { type: string }
        market: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        currency: { type: string }
        retrievedAt: { type: string, format: date-time }
        verification: { type: string, enum: [checkout_verified, page_verified, search_metadata, unverified] }
        condition: { type: string, enum: [new, refurbished, open_box, display, used, unknown] }
        identityScore: { type: number, minimum: 0, maximum: 1 }
        bundleComplete: { type: boolean }
        eligible: { type: boolean }
        seller: { type: string }
        bundleItems: { type: array, items: { type: string } }
        listPrice: { type: number }
        salePrice: { type: number }
        couponPrice: { type: number }
        membershipPrice: { type: number }
        cardPrice: { type: number }
        cardName: { type: string }
        points: { type: number }
        shippingFee: { type: number }
        installationFee: { type: number }
        totalCashPrice: { type: number }
        effectivePrice: { type: number }
        availability: { type: string }
        conditions: { type: array, items: { type: string } }
        riskFlags: { type: array, items: { type: string } }
        exclusionReasons: { type: array, items: { type: string } }
    RankedOffer:
      type: object
      required: [basis, rank, amount, offer, reasons]
      properties:
        basis: { type: string, enum: [cash, owned_card, effective, alternative_condition] }
        rank: { type: integer, minimum: 1 }
        amount: { type: number }
        offer: { $ref: '#/components/schemas/MarketOffer' }
        reasons: { type: array, items: { type: string } }
    BestOffers:
      type: object
      properties:
        cash: { $ref: '#/components/schemas/RankedOffer' }
        ownedCard: { $ref: '#/components/schemas/RankedOffer' }
        effective: { $ref: '#/components/schemas/RankedOffer' }
        alternativeCondition: { $ref: '#/components/schemas/RankedOffer' }
    MarketCoverage:
      type: object
      required: [market, attempted, found, verified, status]
      properties:
        market: { type: string }
        attempted: { type: boolean }
        found: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
        status: { type: string, enum: [verified, found_unverified, no_match, failed, not_attempted] }
        message: { type: string }
    Recommendation:
      type: object
      required: [rank, title, target, scores, bestFor, reasons, tradeoffs, confidence, preliminary]
      properties:
        rank: { type: integer, minimum: 1 }
        title: { type: string }
        target: { $ref: '#/components/schemas/ProductTarget' }
        scores:
          type: object
          properties:
            fit: { type: number }
            quality: { type: number }
            reviews: { type: number }
            design: { type: number }
            care: { type: number }
            risk: { type: number }
            value: { type: number }
            overall: { type: number }
        bestFor: { type: string }
        reasons: { type: array, items: { type: string } }
        tradeoffs: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        preliminary: { type: boolean }
        bestOffer: { $ref: '#/components/schemas/MarketOffer' }
    ManualCheck:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [login, captcha, owned_card, membership, availability, offline_quote, used_condition] }
        message: { type: string }
        url: { type: string, format: uri }
    ConfidenceDimensions:
      type: object
      properties:
        identity: { type: number, minimum: 0, maximum: 1 }
        price: { type: number, minimum: 0, maximum: 1 }
        officialSpecs: { type: number, minimum: 0, maximum: 1 }
        reviews: { type: number, minimum: 0, maximum: 1 }
        negativeSignals: { type: number, minimum: 0, maximum: 1 }
        personalizedPrice: { type: number, minimum: 0, maximum: 1 }
    ProductCandidate:
      type: object
      properties:
        target: { $ref: '#/components/schemas/ProductTarget' }
        title: { type: string }
        score: { type: number }
        sourceUrls:
          type: array
          items: { type: string, format: uri }
    ProductIdentity:
      type: object
      required: [kind, identityConfidence, ambiguous, candidates]
      properties:
        kind: { type: string, enum: [product, place, service, unknown] }
        brand: { type: string }
        name: { type: string }
        model: { type: string }
        variant: { type: string }
        productId: { type: string }
        liveId: { type: string }
        sourceHost: { type: string }
        canonicalUrl: { type: string, format: uri }
        identityConfidence: { type: number, minimum: 0, maximum: 1 }
        ambiguous: { type: boolean }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ProductCandidate'
    ProductTarget:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [product, place, service, unknown] }
        brand: { type: string }
        name: { type: string }
        model: { type: string }
        variant: { type: string }
        productId: { type: string }
        liveId: { type: string }
        sourceHost: { type: string }
        canonicalUrl: { type: string, format: uri }
    RelaySummary:
      type: object
      required: [requested, available, used, mode]
      properties:
        requested: { type: boolean }
        available: { type: boolean }
        used: { type: boolean }
        mode: { type: string, enum: [offline, public_only, local_authenticated] }
        message: { type: string }
    EvidenceSummary:
      type: object
      required: [claim, sourceUrl, evidenceClass, confidence]
      properties:
        claim: { type: string }
        sourceUrl: { type: string, format: uri }
        evidenceClass: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        specificity: { type: string, enum: [exact_product, category, general_mechanism] }
    SourceCoverage:
      type: object
      required: [attempted, succeeded, failed, evidenceCount]
      properties:
        attempted: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        evidenceCount: { type: integer, minimum: 0 }
    AgentResearchResult:
      type: object
      required:
        - status
        - query
        - intent
        - product
        - decision
        - confidence
        - relay
        - summary
        - reasons
        - strengths
        - weaknesses
        - missingInformation
        - evidence
        - sourceCoverage
        - errors
      properties:
        status: { type: string, enum: [queued, running, completed, partial, failed] }
        jobId: { type: string }
        pollUrl: { type: string }
        query: { type: string }
        intent:
          $ref: '#/components/schemas/ResearchIntent'
        product:
          $ref: '#/components/schemas/ProductIdentity'
        decision: { type: string, enum: [BUY, WAIT, SKIP, INSUFFICIENT] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidenceDimensions:
          $ref: '#/components/schemas/ConfidenceDimensions'
        price:
          $ref: '#/components/schemas/PriceSnapshot'
        personalizedPrice:
          $ref: '#/components/schemas/PriceSnapshot'
        offers:
          type: array
          items: { $ref: '#/components/schemas/MarketOffer' }
        bestOffers:
          $ref: '#/components/schemas/BestOffers'
        marketCoverage:
          type: array
          items: { $ref: '#/components/schemas/MarketCoverage' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        manualChecks:
          type: array
          items: { $ref: '#/components/schemas/ManualCheck' }
        relay:
          $ref: '#/components/schemas/RelaySummary'
        summary: { type: string }
        reasons:
          type: array
          items: { type: string }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        missingInformation:
          type: array
          items: { type: string }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceSummary'
        sourceCoverage:
          $ref: '#/components/schemas/SourceCoverage'
        purchaseContextApplied:
          $ref: '#/components/schemas/PurchaseContext'
        errors:
          type: array
          items: { type: string }
