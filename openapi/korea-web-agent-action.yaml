openapi: 3.1.0
info:
  title: Korea Web Agent
  version: 0.6.0
  description: Read-only Korean shopping intelligence with category recommendations, exact-SKU validation, payment promotions, membership economics, event validity, and observed 180-day price history.
servers:
  - url: https://korea-web-agent.netlify.app
security:
  - bearerAuth: []
paths:
  /api/agent/research:
    post:
      operationId: startProductResearch
      summary: Research one exact product or one recommendation category and return a structured shopping decision.
      description: Research exactly one product or recommendation category per call. Preserve resolved brand/model/variant from conversation context. Pass purchaseContext only when explicitly supplied; advertised payment promotions are discovered independently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: One exact product or one recommendation category. Include known SKU-defining model, variant, size, generation, bundle, and accessory codes.
                url:
                  type: string
                  format: uri
                  maxLength: 4000
                  description: Optional public retailer, product, or Shopping Live URL.
                purchaseContext:
                  $ref: '#/components/schemas/PurchaseContext'
      responses:
        '200':
          description: Research completed without a pending authenticated-browser job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResearchResult' }
        '202':
          description: Public research completed and an authenticated PC browser result is pending. Poll using the returned jobId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResearchResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/agent/job:
    get:
      operationId: getProductResearchResult
      summary: Get the latest result for a product research job.
      description: Call after startProductResearch returns status=running. Pass jobId unchanged and continue only while status remains running; stop on completed, partial, or failed.
      parameters:
        - name: jobId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Current or final structured research result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentResearchResult' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key
  responses:
    Error:
      description: Request error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    ResearchIntent:
      type: object
      required: [productResearch, purchaseDecision, priceSensitive, personalizedPriceUseful, specOnly]
      properties:
        productResearch: { type: boolean }
        purchaseDecision: { type: boolean }
        priceSensitive: { type: boolean }
        personalizedPriceUseful: { type: boolean }
        specOnly: { type: boolean }
    PurchaseContext:
      type: object
      additionalProperties: false
      description: Request-scoped shopping context only. The service does not create a durable user payment profile. Card names only; never card numbers.
      properties:
        ownedCards:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
          description: Cards explicitly stated by the user for this request/conversation. Never infer ownership from an advertised promotion.
        memberships:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
        budget: { type: number, exclusiveMinimum: 0 }
        region: { type: string, maxLength: 200 }
        preferences:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }
    PriceSnapshot:
      type: object
      required: [currency]
      properties:
        currency: { type: string }
        listPrice: { type: number }
        salePrice: { type: number }
        couponPrice: { type: number }
        membershipPrice: { type: number }
        sellerInstantDiscount: { type: number }
        couponDiscount: { type: number }
        cardInstantDiscount: { type: number }
        cardStatementDiscount: { type: number }
        membershipDiscount: { type: number }
        cashPaymentPrice: { type: number }
        estimatedPoints: { type: number }
        basePoints: { type: number }
        membershipPoints: { type: number }
        liveSpecialPoints: { type: number }
        totalExpectedPoints: { type: number }
        effectivePrice: { type: number }
        shippingFee: { type: number }
        shippingEta: { type: string }
        selectedOption: { type: string }
        availability: { type: string }
        dealType: { type: string }
        liveId: { type: string }
        liveStatus: { type: string }
        liveEndAt: { type: string }
        sourceUrl: { type: string, format: uri }
    ProductTarget:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [product, place, service, unknown] }
        brand: { type: string }
        name: { type: string }
        model: { type: string }
        variant: { type: string }
        productId: { type: string }
        liveId: { type: string }
        sourceHost: { type: string }
        canonicalUrl: { type: string, format: uri }
    ProductCandidate:
      type: object
      required: [target, score, sourceUrls, title]
      properties:
        target: { $ref: '#/components/schemas/ProductTarget' }
        score: { type: number }
        sourceUrls:
          type: array
          items: { type: string, format: uri }
        title: { type: string }
    ProductIdentity:
      type: object
      required: [kind, identityConfidence, ambiguous, candidates]
      properties:
        kind: { type: string, enum: [product, place, service, unknown] }
        brand: { type: string }
        name: { type: string }
        model: { type: string }
        variant: { type: string }
        productId: { type: string }
        liveId: { type: string }
        sourceHost: { type: string }
        canonicalUrl: { type: string, format: uri }
        identityConfidence: { type: number, minimum: 0, maximum: 1 }
        ambiguous: { type: boolean }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ProductCandidate' }
    MarketOffer:
      type: object
      required: [id, market, title, url, currency, retrievedAt, verification, condition, identityScore, bundleComplete, eligible, conditions, riskFlags, exclusionReasons]
      properties:
        id: { type: string }
        market: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        currency: { type: string }
        retrievedAt: { type: string, format: date-time }
        verification: { type: string, enum: [checkout_verified, page_verified, search_metadata, unverified] }
        condition: { type: string, enum: [new, refurbished, open_box, display, used, unknown] }
        identityScore: { type: number, minimum: 0, maximum: 1 }
        bundleComplete: { type: boolean }
        eligible: { type: boolean }
        seller: { type: string }
        bundleItems: { type: array, items: { type: string } }
        listPrice: { type: number }
        salePrice: { type: number }
        couponPrice: { type: number }
        membershipPrice: { type: number }
        cardPrice: { type: number }
        cardName: { type: string }
        paymentMethod: { type: string, description: Advertised card/pay method such as a named card, Toss Pay, Kakao Pay, or Naver Pay. Does not imply ownership. }
        paymentPrice: { type: number }
        membershipName: { type: string }
        nonMemberPrice: { type: number }
        memberPoints: { type: number }
        nonMemberPoints: { type: number }
        points: { type: number }
        shippingFee: { type: number }
        installationFee: { type: number }
        totalCashPrice: { type: number }
        effectivePrice: { type: number }
        availability: { type: string }
        warranty: { type: string }
        returnPolicy: { type: string }
        observedAt: { type: string, format: date-time }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone: { type: string }
        validityStatus: { type: string, enum: [active, upcoming, expired, unknown] }
        conditions: { type: array, items: { type: string } }
        riskFlags: { type: array, items: { type: string } }
        exclusionReasons: { type: array, items: { type: string } }
    RankedOffer:
      type: object
      required: [basis, rank, amount, offer, reasons]
      properties:
        basis: { type: string, enum: [cash, owned_card, advertised_payment, effective, alternative_condition] }
        rank: { type: integer, minimum: 1 }
        amount: { type: number }
        offer: { $ref: '#/components/schemas/MarketOffer' }
        reasons: { type: array, items: { type: string } }
    BestOffers:
      type: object
      properties:
        cash: { $ref: '#/components/schemas/RankedOffer' }
        ownedCard: { $ref: '#/components/schemas/RankedOffer' }
        advertisedPayment: { $ref: '#/components/schemas/RankedOffer' }
        effective: { $ref: '#/components/schemas/RankedOffer' }
        alternativeCondition: { $ref: '#/components/schemas/RankedOffer' }
    PaymentPromotion:
      type: object
      required: [method, amount, market, url, verification, retrievedAt, conditions]
      properties:
        method: { type: string }
        amount: { type: number }
        market: { type: string }
        url: { type: string, format: uri }
        verification: { type: string, enum: [checkout_verified, page_verified, search_metadata, unverified] }
        retrievedAt: { type: string, format: date-time }
        conditions: { type: array, items: { type: string } }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        validityStatus: { type: string, enum: [active, upcoming, expired, unknown] }
    MembershipScenario:
      type: object
      required: [member, market, url, verification, retrievedAt, notes]
      properties:
        member: { type: boolean }
        membership: { type: string }
        market: { type: string }
        url: { type: string, format: uri }
        paymentPrice: { type: number }
        expectedPoints: { type: number }
        effectivePrice: { type: number }
        verification: { type: string, enum: [checkout_verified, page_verified, search_metadata, unverified] }
        retrievedAt: { type: string, format: date-time }
        notes: { type: array, items: { type: string } }
    MarketCoverage:
      type: object
      required: [market, attempted, found, verified, status]
      properties:
        market: { type: string }
        attempted: { type: boolean }
        found: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
        status: { type: string, enum: [verified, found_unverified, no_match, failed, not_attempted] }
        message: { type: string }
    Recommendation:
      type: object
      required: [rank, title, target, scores, bestFor, reasons, tradeoffs, confidence, preliminary]
      properties:
        rank: { type: integer, minimum: 1 }
        title: { type: string }
        target: { $ref: '#/components/schemas/ProductTarget' }
        scores:
          type: object
          properties:
            fit: { type: number }
            quality: { type: number }
            reviews: { type: number }
            design: { type: number }
            care: { type: number }
            risk: { type: number }
            value: { type: number }
            overall: { type: number }
        bestFor: { type: string }
        reasons: { type: array, items: { type: string } }
        tradeoffs: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
        preliminary: { type: boolean }
        bestOffer: { $ref: '#/components/schemas/MarketOffer' }
    ManualCheck:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [login, captcha, owned_card, membership, availability, offline_quote, used_condition] }
        message: { type: string }
        url: { type: string, format: uri }
    PriceHistory:
      type: object
      required: [coverage, observationCount, position]
      properties:
        coverage: { type: string, enum: [observed_only, external_supported] }
        observationCount: { type: integer, minimum: 0 }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
        currentPrice: { type: number }
        previousPrice: { type: number }
        changeFromPrevious: { type: number }
        minimum: { type: number }
        maximum: { type: number }
        mean: { type: number }
        median: { type: number }
        percentile: { type: number }
        position: { type: string, enum: [new_low, near_low, below_average, around_average, above_average, new_high, insufficient_history] }
    PresentationRow:
      type: object
      required: [label, verification, retrievedAt, notes]
      properties:
        label: { type: string, enum: [현금 실결제가, 보유카드가, 광고 결제수단 최저가, 회원 체감가, 비회원 체감가, 리퍼/반품/중고, 180일 가격 위치] }
        amount: { type: number }
        market: { type: string }
        seller: { type: string }
        paymentMethod: { type: string }
        membership: { type: string }
        expectedPoints: { type: number }
        effectivePrice: { type: number }
        eventPeriod: { type: string }
        verification: { type: string }
        retrievedAt: { type: string, format: date-time }
        notes: { type: array, items: { type: string } }
    Presentation:
      type: object
      required: [schemaVersion, rows]
      properties:
        schemaVersion: { type: string, const: '1' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PresentationRow' }
    ConfidenceDimensions:
      type: object
      properties:
        identity: { type: number, minimum: 0, maximum: 1 }
        price: { type: number, minimum: 0, maximum: 1 }
        officialSpecs: { type: number, minimum: 0, maximum: 1 }
        reviews: { type: number, minimum: 0, maximum: 1 }
        negativeSignals: { type: number, minimum: 0, maximum: 1 }
        personalizedPrice: { type: number, minimum: 0, maximum: 1 }
    RelaySummary:
      type: object
      required: [requested, available, used, mode]
      properties:
        requested: { type: boolean }
        available: { type: boolean }
        used: { type: boolean }
        mode: { type: string, enum: [offline, public_only, local_authenticated] }
        message: { type: string }
    EvidenceSummary:
      type: object
      required: [claim, sourceUrl, evidenceClass, confidence]
      properties:
        claim: { type: string }
        sourceUrl: { type: string, format: uri }
        evidenceClass: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        specificity: { type: string, enum: [exact_product, category, general_mechanism] }
    SourceCoverage:
      type: object
      required: [attempted, succeeded, failed, evidenceCount]
      properties:
        attempted: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        evidenceCount: { type: integer, minimum: 0 }
    AgentResearchResult:
      type: object
      required: [status, query, intent, product, researchMode, assumptions, clarificationRequired, clarificationQuestions, decision, confidence, relay, summary, reasons, strengths, weaknesses, missingInformation, evidence, sourceCoverage, errors]
      properties:
        status: { type: string, enum: [queued, running, completed, partial, failed] }
        jobId: { type: string }
        pollUrl: { type: string }
        query: { type: string }
        intent: { $ref: '#/components/schemas/ResearchIntent' }
        product: { $ref: '#/components/schemas/ProductIdentity' }
        researchMode: { type: string, enum: [exact_product, category_recommendation] }
        assumptions: { type: array, items: { type: string } }
        clarificationRequired: { type: boolean }
        clarificationQuestions: { type: array, maxItems: 3, items: { type: string } }
        decision: { type: string, enum: [BUY, WAIT, SKIP, INSUFFICIENT] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidenceDimensions: { $ref: '#/components/schemas/ConfidenceDimensions' }
        price: { $ref: '#/components/schemas/PriceSnapshot' }
        personalizedPrice: { $ref: '#/components/schemas/PriceSnapshot' }
        offers:
          type: array
          items: { $ref: '#/components/schemas/MarketOffer' }
        bestOffers: { $ref: '#/components/schemas/BestOffers' }
        paymentPromotions:
          type: array
          items: { $ref: '#/components/schemas/PaymentPromotion' }
        membershipScenarios:
          type: array
          items: { $ref: '#/components/schemas/MembershipScenario' }
        priceHistory: { $ref: '#/components/schemas/PriceHistory' }
        presentation: { $ref: '#/components/schemas/Presentation' }
        marketCoverage:
          type: array
          items: { $ref: '#/components/schemas/MarketCoverage' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        manualChecks:
          type: array
          items: { $ref: '#/components/schemas/ManualCheck' }
        relay: { $ref: '#/components/schemas/RelaySummary' }
        summary: { type: string }
        reasons: { type: array, items: { type: string } }
        strengths: { type: array, items: { type: string } }
        weaknesses: { type: array, items: { type: string } }
        missingInformation: { type: array, items: { type: string } }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceSummary' }
        sourceCoverage: { $ref: '#/components/schemas/SourceCoverage' }
        purchaseContextApplied: { $ref: '#/components/schemas/PurchaseContext' }
        errors: { type: array, items: { type: string } }
